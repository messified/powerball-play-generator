<!-- lottery-settings.component.html -->
<form [formGroup]="settingsForm" (ngSubmit)="onSubmit()">
    <div>
      <label for="recencyExpBase">Recency Exp Base:</label>
      <input
        id="recencyExpBase"
        type="number"
        step="0.01"
        formControlName="recencyExpBase"
      />
      <!-- Example display of validation errors: -->
      <div *ngIf="settingsForm.get('recencyExpBase')?.invalid && settingsForm.get('recencyExpBase')?.touched">
        <small class="error" *ngIf="settingsForm.get('recencyExpBase')?.errors?.['required']">
          Recency Exp Base is required.
        </small>
      </div>
    </div>
  
    <div>
      <label for="ticketCount">Ticket Count:</label>
      <input
        id="ticketCount"
        type="number"
        formControlName="ticketCount"
      />
      <!-- Example display of validation errors: -->
      <div *ngIf="settingsForm.get('ticketCount')?.invalid && settingsForm.get('ticketCount')?.touched">
        <small class="error" *ngIf="settingsForm.get('ticketCount')?.errors?.['required']">
          Ticket Count is required.
        </small>
        <small class="error" *ngIf="settingsForm.get('ticketCount')?.errors?.['min']">
          Ticket Count must be at least 1.
        </small>
      </div>
    </div>
  
    <button type="submit" [disabled]="settingsForm.invalid">
      Generate
    </button>
  </form>
